pre-commit:
  parallel: true
  jobs:
    - name: check skills sync
      glob:
        - '.agents/skills/**'
        - '.claude/skills/**'
      run: bun scripts/sync-skills.ts --check
    - name: lint
      glob:
        - '*.{ts,js,vue,md,yaml,yml}'
        - '**/*.{ts,js,vue,md,yaml,yml}'
      run: bun run lint --fix {staged_files}
      stage_fixed: true
