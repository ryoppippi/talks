pre-commit:
  parallel: true
  jobs:
    - name: check skills sync
      glob:
        - '.agents/skills/**'
        - '.claude/skills/**'
      run: node scripts/sync-skills.ts --check
    - name: lint
      glob:
        - '*.{ts,js,vue,md,yaml,yml,json}'
        - '**/*.{ts,js,vue,md,yaml,yml,json}'
      run: pnpm exec eslint --cache --fix {staged_files}
      stage_fixed: true
    - name: nixfmt
      glob: '*.nix'
      run: nix develop --command nixfmt {staged_files}
      stage_fixed: true
